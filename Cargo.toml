[package]
name = "llmbench"
version = "0.1.0"
edition = "2021"
description = "Benchmark a local inference server against another, on the same prompts and the same clock"
repository = "https://github.com/loken-ai/loken-bench"
license = "MIT OR Apache-2.0"
keywords = ["llm", "benchmark"]
categories = ["command-line-utilities"]

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", features = ["json", "blocking", "stream", "multipart"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
nvml-wrapper = "0.12"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
